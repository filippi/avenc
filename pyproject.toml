[build-system]
requires = ["scikit-build-core>=0.11,<2", "pybind11>=3.0,<4", "eccodeslib==2.50.0.33", "eckitlib==2.5.0.33", "delocate==0.13.0; sys_platform == 'darwin'", "patchelf>=0.17; sys_platform == 'linux'"]
build-backend = "scikit_build_core.build"

[project]
name = "avenc"
dynamic = ["version"]
description = "Video compression and lazy xarray access for meteorological GRIB grids"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jean-Baptiste Filippi", email = "filippi_j@univ-corse.fr"}]
dependencies = ["numpy>=1.24", "xarray>=2023.12", "pandas>=2"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Programming Language :: C++", "Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Topic :: Scientific/Engineering :: Atmospheric Science"]

[project.urls]
Homepage = "https://github.com/filippi/avenc"
Source = "https://github.com/filippi/avenc"
Documentation = "https://github.com/filippi/avenc#readme"
Issues = "https://github.com/filippi/avenc/issues"

[project.optional-dependencies]
test = ["pytest>=7.4", "dask[array]", "cfgrib>=0.9.11", "eccodes>=2.40"]

[project.entry-points."xarray.backends"]
avenc = "avenc_xarray.backend:AvencBackendEntrypoint"

[project.scripts]
grib2avenc = "avenc.cli:grib2avenc"
avenc2grib = "avenc.cli:avenc2grib"
avpack = "avenc.cli:avpack"
avenc-compare = "avenc.cli:compare"
grib_pair_extract = "avenc.cli:grib_pair_extract"
avenc_test_generator = "avenc.cli:avenc_test_generator"
ComputeError = "avenc.cli:compute_error"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/avenc/avenc", "python/avenc/avenc_xarray"]
wheel.license-files = ["LICENSE", "python/avenc/LICENSES/*", "THIRD_PARTY.md"]
sdist.include = ["VERSION", "src/**", "python/**", "packaging/**", "tests/**", "CMakeLists.txt", "www/**"]
sdist.exclude = ["**/__pycache__/**", "**/*.mp4", "**/*.grib", "build*/**", "bin/**", "dist/**"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>[0-9]+[.][0-9]+[.][0-9]+)"

[tool.scikit-build.cmake.define]
AVENC_BUILD_PYTHON = "ON"
AVENC_PYTHON_ECCODES = "ON"
BUILD_TESTING = "OFF"
ENABLE_NATIVE_ARCH = "OFF"
ENABLE_FAST_MATH = "OFF"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *-win* *-manylinux_i686 *-macosx_universal2"
test-requires = ["eccodes>=2.40", "pytest", "dask[array]"]
test-command = "python {project}/packaging/smoke_test.py"
before-build = "pip install eccodeslib==2.50.0.33 eckitlib==2.5.0.33 auditwheel delocate==0.13.0"
before-test = "python {project}/packaging/test_media.py"

[tool.cibuildwheel.linux]
before-all = "/opt/python/cp312-cp312/bin/python {project}/packaging/bootstrap_media.py"
environment = { PATH = "/opt/avenc-ci-media/bin:$PATH" }
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "python {project}/packaging/repair_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }
repair-wheel-command = "python {project}/packaging/repair_wheel.py {wheel} {dest_dir}"
