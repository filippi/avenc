<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVENC Browser Visualizer</title>
  <style>
    :root {
      --bg: #0a111a;
      --panel: #111b27;
      --line: #20344a;
      --txt: #d9e2ef;
      --muted: #8fa2ba;
      --accent: #2db1ff;
      --warn: #ffcf5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--txt);
      background: radial-gradient(circle at 10% 5%, #122336 0%, var(--bg) 46%);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      padding: 10px;
    }
    .top {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto 1fr;
      gap: 8px;
      align-items: end;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    select, button, input[type="range"] {
      width: 100%;
      border: 1px solid #33506d;
      border-radius: 8px;
      background: #0d1825;
      color: var(--txt);
      padding: 7px 8px;
    }
    button {
      width: auto;
      min-width: 90px;
      cursor: pointer;
      border-color: #356088;
      background: #123155;
    }
    button:hover { background: #17406f; }
    .status-row {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
      flex: 1;
    }
    .progress-wrap {
      width: 220px;
      height: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      opacity: 0;
      transition: opacity .2s;
    }
    .progress-wrap.active { opacity: 1; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1b7ccb, #4fd6ff);
      transition: width .1s linear;
    }
    .main {
      display: grid;
      grid-template-columns: minmax(640px, 1fr) 340px;
      gap: 12px;
      align-items: start;
    }
    .canvas-wrap {
      position: relative;
      display: grid;
      justify-items: center;
      background: #050b12;
      border-radius: 10px;
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: 420px;
      padding: 6px;
    }
    #glCanvas {
      width: min(100%, 1100px);
      height: auto;
      image-rendering: pixelated;
      background: #000;
      border-radius: 4px;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      background: rgba(5, 13, 21, 0.95);
      border: 1px solid #2b4864;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #dce9f8;
      min-width: 0;
      white-space: nowrap;
      transform: translate(10px, 12px);
      display: none;
    }
    .crosshair-v, .crosshair-h {
      position: absolute;
      pointer-events: none;
      z-index: 8;
      background: rgba(200, 208, 218, 0.45);
      display: none;
    }
    .crosshair-v {
      width: 2px;
      top: 0;
      bottom: 0;
    }
    .crosshair-h {
      height: 2px;
      left: 0;
      right: 0;
    }
    .cross-label {
      position: absolute;
      pointer-events: none;
      z-index: 9;
      font-size: 12px;
      color: #dbe7f6;
      background: rgba(7, 14, 24, 0.9);
      border: 1px solid #2b4864;
      border-radius: 6px;
      padding: 2px 6px;
      display: none;
      white-space: nowrap;
    }
    .marker-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .marker-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.12);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
    }
    .marker-label {
      position: absolute;
      transform: translate(8px, -14px);
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      color: #e7f0fb;
      background: rgba(4, 12, 20, 0.86);
      border: 1px solid #2d4a66;
      border-radius: 6px;
      padding: 2px 6px;
      white-space: nowrap;
    }
    .legend-canvas {
      width: 100%;
      height: 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      display: block;
      margin-top: 6px;
    }
    .legend-range {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .legend-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .legend-actions button {
      flex: 1;
      min-width: 0;
    }
    .kv {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #cfe2f8;
    }
    .signature {
      margin-top: 6px;
      font-size: 12px;
      color: #b7c9de;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .signature .links {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .signature a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .signature a:hover {
      text-decoration: underline;
    }
    .timeline-wrap {
      display: grid;
      gap: 6px;
    }
    .timeline-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }
    #timeLabel {
      font-size: 18px;
      line-height: 1;
      color: #dff2ff;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    @media (max-width: 1100px) {
      .top {
        grid-template-columns: 1fr 1fr;
      }
      .main {
        grid-template-columns: 1fr;
      }
      #glCanvas {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="top">
        <div>
          <label for="groupSelect">Group / Stream</label>
          <select id="groupSelect"></select>
        </div>
        <div>
          <label for="colormapSelect">Colormap</label>
          <select id="colormapSelect">
            <option value="gray" selected>Grayscale</option>
            <option value="jet">Jet</option>
            <option value="viridis">Viridis</option>
          </select>
        </div>
        <div>
          <label for="playBtn">Playback</label>
          <button id="playBtn" type="button">Play</button>
        </div>
        <div>
          <label for="rateSelect">Rate</label>
          <select id="rateSelect">
            <option value="1">1 h/s</option>
            <option value="3">3 h/s</option>
            <option value="6">6 h/s</option>
            <option value="12">12 h/s</option>
            <option value="24">24 h/s</option>
            <option value="48">48 h/s</option>
          </select>
        </div>
      </div>
      <div class="status-row">
        <div class="progress-wrap" id="decodeProgressWrap">
          <div class="progress-fill" id="decodeProgressFill"></div>
        </div>
        <div class="status" id="statusText"></div>
        <div class="status">Frames load on demand. Only two decoded frames are kept in memory.</div>
      </div>
      <div class="signature">
        <span>AVENc - Jean-Baptiste Filippi - firecaster.org - CNRS - Università di Corsica</span>
        <span class="links">
          <a href="./index.php">Dataset List</a>
          <a href="./about.html">About AVENC</a>
        </span>
      </div>
    </div>

    <div class="panel timeline-wrap">
      <div class="timeline-head">
        <div id="frameLabel">frame=0</div>
        <div id="timeLabel">time=--</div>
      </div>
      <input id="timeline" type="range" min="0" max="0" step="1" value="0">
    </div>

    <div class="main">
      <div class="canvas-wrap panel">
        <canvas id="glCanvas" width="960" height="540"></canvas>
        <div id="markerLayer" class="marker-layer"></div>
        <div id="crossV" class="crosshair-v"></div>
        <div id="crossH" class="crosshair-h"></div>
        <div id="crossLonLabel" class="cross-label"></div>
        <div id="crossLatLabel" class="cross-label"></div>
        <div id="crossValueLabel" class="cross-label"></div>
        <div id="hoverTooltip" class="tooltip"></div>
      </div>

      <div class="panel">
        <div><strong>Color Scale</strong></div>
        <canvas id="legendCanvas" class="legend-canvas" width="320" height="16"></canvas>
        <div class="legend-range">
          <span id="legendMin">min</span>
          <span id="legendMax">max</span>
        </div>
        <div class="legend-actions">
          <button id="scaleLockBtn" type="button">Lock Scale</button>
          <button id="rescaleBtn" type="button">Rescale</button>
        </div>
        <hr style="border: none; border-top: 1px solid var(--line); margin: 10px 0;">
        <div><strong>Dataset Stats</strong></div>
        <pre id="datasetInfo" class="kv">No dataset loaded.</pre>
        <hr style="border: none; border-top: 1px solid var(--line); margin: 10px 0;">
        <div><strong>Cursor Info</strong></div>
        <pre id="cursorInfo" class="kv">Move mouse over map.</pre>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.3/dist/mp4box.all.min.js"></script>
  <script type="module" src="./js/avenc_view.js"></script>
</body>
</html>
