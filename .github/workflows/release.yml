name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after validation (requires repository gate and environment approval)'
        type: boolean
        default: false
      target:
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require the selected tag to match VERSION
        shell: bash
        run: 'test "$GITHUB_REF_NAME" = "v$(cat VERSION)"'
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  wheels:
    needs: [version, checks]
    uses: ./.github/workflows/wheels.yml
  artifacts:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: python -m pip install build twine
      - run: python -m build --sdist && python -m twine check dist/*
      - name: Native archives from the tested CPython 3.11 wheels
        run: |
          for wheel in dist/*cp311*.whl; do python packaging/make_native.py "$wheel"; done
          python packaging/check_artifacts.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
  publish:
    needs: artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.AVENC_RELEASE_ENABLED == 'true' && vars.AVENC_LINUX_DEPENDENCIES_APPROVED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-artifacts
          path: artifacts
      - name: Select Python distributions only
        run: |
          mkdir dist
          python - <<'PYTHON'
          import pathlib, re, shutil
          for f in pathlib.Path('artifacts').iterdir():
              if f.suffix == '.whl' or re.fullmatch(r'avenc-\d+\.\d+\.\d+\.tar\.gz', f.name):
                  shutil.copy2(f, 'dist')
          PYTHON
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
  github-release:
    needs: [artifacts, publish]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.target == 'pypi' && vars.AVENC_RELEASE_ENABLED == 'true' && vars.AVENC_LINUX_DEPENDENCIES_APPROVED == 'true'
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-artifacts
          path: dist
      - name: Publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "AVENC $GITHUB_REF_NAME" --generate-notes
