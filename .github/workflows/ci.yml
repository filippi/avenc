name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev zlib1g-dev libpng-dev libopenjp2-7-dev ffmpeg
      - name: Native prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install eccodes ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 3 && ctest --test-dir build --output-on-failure
      - run: python -m pip install '.[test]' build twine
      - name: Installed source build and tiny round trip
        run: python packaging/smoke_test.py
      - name: Existing scientific comparison tests
        run: python -m unittest discover -s tests -p test_avenc_compare.py -v
      - name: Backend metadata and HTTP tests
        run: python -m pytest -q python/avenc/tests/test_metadata_v2.py python/avenc/tests/test_http_input.py
      - name: Browser tools
        run: node www/tests/metadata.mjs && node www/tests/decoder.mjs
      - run: python -m build --sdist && python -m twine check dist/*
